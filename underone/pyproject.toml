[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "under-one-skills"
version = "10.0.0"
description = "八奇技 Agent 运维框架"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "under-one.skills Team"}]
dependencies = [
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.1", "mypy"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.34"]
llm = ["openai>=1.0", "anthropic>=0.34"]
viz = ["matplotlib>=3.5", "numpy>=1.21"]

[project.scripts]
under-one = "under_one.cli:main"

[project.urls]
Homepage = "https://github.com/isLinXu/under-one"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["under_one*", "skills*"]

[tool.setuptools.package-data]
under_one = ["py.typed"]
skills = ["**/*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
# Analysis target for mypy itself (the package still supports the 3.9+ runtime
# declared in [project].requires-python; modern mypy only accepts >=3.10 here).
python_version = "3.10"
warn_return_any = true
# Skill scripts are standalone, dependency-free and dynamically loaded, so the
# global default stays lenient. The public SDK package is held to a stricter
# bar via the per-module override below.
disallow_untyped_defs = false
ignore_missing_imports = true

# Public SDK surface: keep it clean and well-typed.
[[tool.mypy.overrides]]
module = "under_one.*"
warn_return_any = true
check_untyped_defs = true

# Skill layer is intentionally dynamic and self-contained; do not fail the SDK
# type gate on it.
[[tool.mypy.overrides]]
module = "skills.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
